[package]
name = "comfy-cli"
version = "0.1.0"
edition = "2021"
description = "Standalone multimedia CLI (image / music / video / audio-video / 3D) for ComfyUI-Rust"

[lib]
name = "comfy_cli"
path = "src/lib.rs"

[[bin]]
name = "comfy"
path = "src/bin/comfy.rs"

[dependencies]
comfy-inference = { path = "../comfy-inference" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
