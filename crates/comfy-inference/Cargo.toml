[package]
name = "comfy-inference"
version = "0.1.0"
edition = "2021"
description = "Inference backend for ComfyUI-Rust, integrating stable-diffusion-cpp via FFI"

[dependencies]
comfy-core = { path = "../comfy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
png = "0.17"
gif = "0.13"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"], optional = true }
base64 = { version = "0.22", optional = true }
tempfile = { version = "3", optional = true }
tracing = "0.1"

[build-dependencies]
cc = "1"
cmake = "0.1"

[features]
default = []
local = []
local-ffi = ["local"]
local-build = ["local-ffi"]
remote = ["reqwest", "base64"]
flash-attn = ["reqwest", "base64", "tempfile", "remote"]
# ComfyUI HTTP bridge backend (cross-platform). On Windows it is always
# available; on other platforms enable this feature to use a native ComfyUI
# Python server as the inference backend.
comfyui-bridge = ["reqwest", "base64"]

# The ComfyUI bridge backend talks to a ComfyUI server over HTTP. On Windows
# reqwest is always needed; on other platforms it is pulled in by the
# `comfyui-bridge` feature.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
